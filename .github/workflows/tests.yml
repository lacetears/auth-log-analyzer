name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python cybersecurity/detect.py
      - run: python -m pytest -q
      - run: python cybersecurity/detect.py --input cybersecurity/data/spray_events.jsonl --output /tmp/spray-alerts.json
